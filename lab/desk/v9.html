/* токены сцены: src/tokens.scene.js (единственный вход бренда) */
/* панель v2: house.tokens.css и panel.css verbatim, скоуп .pv2 сборкой; шрифт хрома Geist */
.pv2[data-theme]{--nh:80;--brand-hue:182;
  --bg:#f6f5f2;--side:rgba(246,245,242,.86);--card:#ecebe6;--field:#ffffff;--stage:#ffffff;
  --ink:#1a1a1a;--ink2:#3d3c39;--ink3:#5c5b57;--on-ink:#ffffff;--on-ink-muted:rgba(255,255,255,.72);--knob:#ffffff;
  --fill:rgba(26,26,26,.07);--fill-hover:rgba(26,26,26,.10);--fill-strong:rgba(26,26,26,.15);--fill-active:rgba(26,26,26,.24);--line-strong:rgba(26,26,26,.28);
  --line:rgba(26,26,26,.14);--line-ctl:rgba(26,26,26,.28);--hair:rgba(26,26,26,.10);--hover:rgba(26,26,26,.055);
  --sel:oklch(.49 .08 var(--brand-hue));--selfg:#ffffff;--ring:oklch(.49 .08 var(--brand-hue));--seg-on:#ffffff;--track-s:.02em;
  --m-wait:oklch(.76 .12 78);--m-work:oklch(.52 .085 var(--brand-hue));--m-pause:#b9b8b2;--m-done:#d9d8d2;
  --st-ok:oklch(.6 .09 145);--st-run:oklch(.55 .09 var(--brand-hue));--st-wait:oklch(.74 .13 75);--st-bad:oklch(.56 .15 40);--st-sched:oklch(.6 .05 230);--st-info:oklch(.66 .07 205);
  --t-bad:oklch(.52 .12 45);--t-wait:oklch(.5 .09 70);--on-wait:oklch(.26 .05 75);
  --scrim:rgba(20,20,20,.36);--shadow:rgba(20,20,20,.28);--shadow-s:rgba(20,20,20,.10);
  --bt:.24;--btc:.03;
  --ground-light:#ffffff;--ground-light-muted:rgba(0,0,0,.55);--ground-dark:#141414;--ground-dark-muted:rgba(255,255,255,.62);
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --display:"Inter Tight",-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif;
  --t1:11.67px;--t2:14px;--t3:16.8px;--t4:20.16px;--t5:24.19px;--t6:29.03px;--t7:34.84px;--t8:41.8px;
  --r-ctl:4px;--r:6px;--r-card:6px;--r-pill:999px;--ease:cubic-bezier(.23,1,.32,1);--dur-press:140ms;--dur-pop:180ms;
  color-scheme:light;--sans:Geist,system-ui,sans-serif;--display:Geist,system-ui,sans-serif;--mono:"Geist Mono",ui-monospace,monospace;}
.pv2[data-theme="dark"]{--bg:#161615;--side:rgba(22,22,21,.86);--card:#21211f;--field:#2b2b29;--stage:#2b2b29;
  --ink:#ecebe6;--ink2:#cfcec8;--ink3:#a6a59f;--on-ink:#161615;--on-ink-muted:rgba(22,22,21,.68);--knob:#ecebe6;
  --fill:rgba(255,255,255,.07);--fill-hover:rgba(255,255,255,.10);--fill-strong:rgba(255,255,255,.16);--fill-active:rgba(255,255,255,.26);--line-strong:rgba(255,255,255,.30);
  --line:rgba(255,255,255,.14);--line-ctl:rgba(255,255,255,.30);--hair:rgba(255,255,255,.10);--hover:rgba(255,255,255,.06);
  --sel:oklch(.78 .09 var(--brand-hue));--selfg:#161615;--ring:oklch(.78 .09 var(--brand-hue) / .7);--seg-on:#3d3d3a;--track-s:.025em;
  --m-wait:oklch(.78 .12 78);--m-work:oklch(.74 .09 var(--brand-hue));--m-pause:#5d5c57;--m-done:#3b3b38;
  --st-ok:oklch(.76 .08 145);--st-run:oklch(.78 .09 var(--brand-hue));--st-wait:oklch(.8 .12 78);--st-bad:oklch(.72 .13 45);--st-sched:oklch(.72 .05 230);--st-info:oklch(.76 .07 205);
  --t-bad:oklch(.74 .11 50);--t-wait:oklch(.82 .1 78);--on-wait:oklch(.22 .04 75);
  --scrim:rgba(0,0,0,.55);--shadow:rgba(0,0,0,.5);--shadow-s:rgba(0,0,0,.3);
  --bt:.95;--btc:.012;color-scheme:dark}
.pv2 .btn{appearance:none;display:inline-flex;align-items:center;gap:8px;border:0;border-radius:var(--r);height:32px;padding:0 14px;font:500 var(--t2)/1 var(--sans);color:var(--ink);background:var(--fill);white-space:nowrap;text-decoration:none;transition:background-color var(--dur-pop) var(--ease),transform var(--dur-press) var(--ease)}
.pv2 .btn.ghost{background:transparent}
.pv2 .btn:active,.pv2 .ibtn:active{transform:scale(.97)}
.pv2 .btn[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.pv2 .ibtn{appearance:none;display:inline-grid;place-items:center;width:32px;height:32px;border:0;border-radius:var(--r);background:transparent;color:var(--ink);flex:none;text-decoration:none;transition:background-color var(--dur-pop) var(--ease),transform var(--dur-press) var(--ease)}
.pv2 .ibtn svg,.pv2 .btn svg,.pv2 .orow svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.pv2 .pill{display:inline-flex;align-items:center;gap:6px;flex:none;font:500 var(--t1)/1 var(--sans);letter-spacing:var(--track-s);padding:5px 8px;border-radius:var(--r-pill);background:var(--fill);color:var(--ink3);white-space:nowrap}
@media (hover:hover) and (pointer:fine){.pv2 .btn:hover{background:var(--fill-strong)}
.pv2 .btn[aria-pressed="true"]:hover{background:var(--ink);opacity:.88}
.pv2 .btn.ghost:hover,.pv2 .ibtn:hover{background:var(--fill)}}
.pv2 .tbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin:0 0 16px;padding:10px 12px;border-radius:var(--r-card);background:var(--card)}
.pv2 .tbar .rows{flex:1 1 320px;max-width:420px}
.pv2 .tbar .row{grid-template-columns:minmax(0,4fr) minmax(0,7fr)}
.pv2 .tbar .cnt{margin-left:auto;color:var(--ink3)}
.pv2 .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:12px}
.pv2 .card{background:var(--card);border-radius:var(--r-card);padding:12px;display:flex;flex-direction:column;gap:12px;min-width:0;scroll-margin:120px}
.pv2 .card.pick{box-shadow:inset 0 0 0 2px var(--sel)}
.pv2 .ch{display:flex;align-items:baseline;gap:8px;min-width:0}
.pv2 .ch .sk{flex:none}
.pv2 .ch h3{margin:0;flex:1;min-width:0;font:600 var(--t3)/1.25 var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv2 .note{margin:-6px 0 0;color:var(--ink3);line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pv2 .stage{position:relative;height:220px;border-radius:var(--r-ctl);overflow:hidden;background:var(--stage);display:grid;place-items:center}
.pv2 .stage[data-ground="light"]{background:var(--ground-light)}
.pv2 .stage[data-ground="dark"]{background:var(--ground-dark)}
.pv2 .stage img{display:block;width:var(--mark,160px);max-width:92%;max-height:80%;object-fit:contain}
.pv2 .stage .meta{position:absolute;left:8px;right:8px;bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;font:500 var(--t1)/1 var(--mono);font-variant-numeric:tabular-nums;color:var(--ground-light-muted);pointer-events:none}
.pv2 .stage[data-ground="dark"] .meta{color:var(--ground-dark-muted)}
.pv2 .stage .meta i{display:inline-block;width:7px;height:7px;margin-right:6px;border-radius:50%;background:var(--st-wait);vertical-align:1px}
.pv2 .empty{grid-column:1/-1;padding:28px 16px;border-radius:var(--r-card);background:var(--card);color:var(--ink3)}
.pv2 .cf{display:flex;align-items:center;gap:8px;margin-top:auto}
.pv2 .cf .grow{flex:1}
.pv2 .rows{display:flex;flex-direction:column;gap:4px;min-width:0}
.pv2 .row{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,6fr);align-items:center;gap:8px;min-height:28px}
.pv2 .lab{display:block;font:400 var(--t1)/1.2 var(--sans);color:var(--ink3);letter-spacing:var(--track-s);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv2 .info{display:inline-grid;place-items:center;vertical-align:-3px;margin-left:6px;width:16px;height:16px;padding:0;border:0;border-radius:50%;background:var(--fill-strong);color:var(--ink);font:600 var(--t1)/1 var(--sans);cursor:help}
.pv2 .hint{grid-column:1/-1;margin:2px 0 4px;font-size:var(--t1);letter-spacing:var(--track-s);color:var(--ink3)}
.pv2 .scrub{position:relative;height:26px;border-radius:var(--r-ctl);background:var(--fill);overflow:hidden;cursor:ew-resize;touch-action:pan-y;user-select:none;-webkit-user-select:none;transition:background-color var(--dur-pop) var(--ease)}
.pv2 .scrub .fill{position:absolute;inset:0;background:var(--fill-strong);transform-origin:0 50%;transform:scaleX(0);pointer-events:none}
.pv2 .scrub.active .fill{background:var(--fill-active)}
.pv2 .scrub .sval{position:absolute;inset:0;width:100%;height:100%;border:0;margin:0;background:transparent;padding:0 8px;text-align:right;font:500 var(--t1)/26px var(--mono);font-variant-numeric:tabular-nums;color:var(--ink);-webkit-text-fill-color:var(--ink);pointer-events:none;outline:none}
.pv2 .scrub.editing{background:var(--field);box-shadow:inset 0 0 0 1px var(--line-strong);cursor:text}
.pv2 .scrub.editing .fill{opacity:0}
.pv2 .scrub.editing .sval{text-align:left}
.pv2 .sw{position:relative;justify-self:start;appearance:none;width:40px;height:24px;border-radius:var(--r-pill);border:0;padding:0;background:var(--fill-strong);transition:background-color var(--dur-pop) var(--ease)}
.pv2 .sw::before{content:"";position:absolute;inset:-10px -4px}
.pv2 .sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--knob);box-shadow:0 1px 1px var(--shadow-s);transition:transform var(--dur-pop) var(--ease)}
.pv2 .sw[aria-checked="true"]{background:var(--ink)}
.pv2 .sw[aria-checked="true"]::after{transform:translateX(16px);background:var(--on-ink)}
.pv2 .seg{display:flex;gap:2px;background:var(--fill);border-radius:var(--r-pill);padding:2px;height:28px;min-width:0}
.pv2 .seg button{flex:1 1 0;min-width:0;border:0;border-radius:var(--r-pill);background:transparent;font:500 var(--t1)/1 var(--sans);letter-spacing:var(--track-s);color:var(--ink3);padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background-color var(--dur-pop) var(--ease),color var(--dur-pop) var(--ease)}
.pv2 .seg button[aria-checked="true"]{background:var(--seg-on);color:var(--ink);box-shadow:0 1px 1px var(--shadow-s)}
.pv2 .tin{height:26px;width:100%;min-width:0;border-radius:var(--r-ctl);border:1px solid var(--line-strong);background:var(--field);font:500 var(--t1) var(--sans);letter-spacing:var(--track-s);padding:0 6px;color:var(--ink)}
.pv2 .colrow{display:flex;gap:6px;align-items:center;min-width:0}

<script>
/* инлайн verbatim рельса: src/tokens.scene.js */
/* tokens.scene.js · единственный вход бренда в сцену (README §8, L10).
   Хексы сцены живут ТОЛЬКО здесь и только в CSS-блоках :root (гейт 3-hardcode читает их как токены).
   Хром панели держит свои токены (house.tokens.css под .pv2), смешивать нельзя. */
(function () {
  'use strict';
  var R = window.RELIEF = window.RELIEF || {};

  R.tokensCSS = [
    ':root{--r-ground:#f0ece4;--r-plate:#f4f1ea;--r-ink:#191713;--r-ink2:#44423e;--r-ink3:#65635e;' +
      '--r-shadow:#464e58;--r-light:#fff9e8;--r-line-a:.22;--r-grain:1.6;' +
      '--r-acc-terracotta:#c16139;--r-acc-cobalt:#345fb2;--r-acc-olive:#70843c}',
    ':root.is-night{--r-ground:#13110e;--r-plate:#171512;--r-ink:#ebe7e0;--r-ink2:#c0bdb8;--r-ink3:#94928d;' +
      '--r-shadow:#000102;--r-light:#ffefd8;--r-line-a:.26;--r-grain:2.2;' +
      '--r-acc-terracotta:#d2764a;--r-acc-cobalt:#638bd5;--r-acc-olive:#889c54}'
  ].join('\n');

  (function inject() {
    if (document.getElementById('relief-tokens')) return;
    var st = document.createElement('style');
    st.id = 'relief-tokens';
    st.textContent = R.tokensCSS;
    (document.head || document.documentElement).appendChild(st);
  })();

  function rgb(s) {
    s = String(s || '').trim();
    var m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(s);
    return m ? [parseInt(m[1], 16), parseInt(m[2], 16), parseInt(m[3], 16)] : [128, 128, 128];
  }
  function lin(c) { c /= 255; return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }
  function lum(c) { return 0.2126 * lin(c[0]) + 0.7152 * lin(c[1]) + 0.0722 * lin(c[2]); }

      theme: theme,

      ink: rgb(v('--r-ink')), ink2: rgb(v('--r-ink2')), ink3: rgb(v('--r-ink3')),
      shadowTint: rgb(v('--r-shadow')), lightTint: rgb(v('--r-light')),
      lineA: parseFloat(v('--r-line-a')) || 0.22,
      grainDefault: parseFloat(v('--r-grain')) || 1.6,
      accent: rgb(v('--r-acc-' + (accent || 'terracotta')))
    };
    root.classList.toggle('is-night', was);
    T.groundY = lum(T.ground);
    cache[key] = T;
    return T;
  };

// ink.js — печать для организмов desk и ledger: текст (Geist, Geist Mono, трекинг по кеглю по

<script>

  // листов (±8°) и качание → масштаб и центр (поля 6 % + место под шапку). Правило раскладки
  // остаётся, меняется только масштаб кадра; kmax > 1 разрешает организму заполнить кадр.
  function halfExt(n) {
    if (n.shape === 'disc') return [n.w / 2, n.w / 2];
    var c = Math.cos(8 * Math.PI / 180), s = Math.sin(8 * Math.PI / 180);
    return [(c * n.w + s * n.h) / 2, (s * n.w + c * n.h) / 2];
  }
  function restPos(M) { return fk(M.chain, 0, { wind: 0, period: 36 }, 'fit', [0, 0]); }
  function fitModel(M, F, top, kmax) {
    var pos = restPos(M), x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    M.nodes.forEach(function (n) { if (n.ghost) return; var p = pos[n.id], e = halfExt(n);
      x0 = Math.min(x0, p.x - e[0]); x1 = Math.max(x1, p.x + e[0]); y0 = Math.min(y0, p.y - e[1]); y1 = Math.max(y1, p.y + e[1]); });
    var m = F.m + 6 * F.ui, tp = top == null ? 0.07 * F.H : top, aw = F.W - 2 * m, ah = F.H - 2 * m - tp;
    var k = Math.min(kmax == null ? 1 : kmax, aw / (x1 - x0), ah / (y1 - y0));
    M.chain.forEach(function (c) { c.rest = [c.rest[0] * k, c.rest[1] * k]; });
    M.nodes.forEach(function (n) { n.w *= k; n.h *= k; });
    M.cx = F.W / 2 - (x0 + x1) / 2 * k; M.cy = m + tp + ah / 2 - (y0 + y1) / 2 * k;
    M.k = k;

  }
  // воздух между плашками: в позе покоя раздвинуть пересечения (рамки с зазором gap), лёгкое
  // уступает тяжёлому, корень и закреплённые стоят; затем позы пересчитываются в векторы подвеса
  function relax(M, gap, keep) {
    var pos = restPos(M), ids = M.nodes.filter(function (n) { return !n.ghost; }).map(function (n) { return n.id; });
    var byId = {}; M.nodes.forEach(function (n) { byId[n.id] = n; });
    var P = {}; Object.keys(pos).forEach(function (k) { P[k] = [pos[k].x, pos[k].y]; });
    keep = keep || {};
    for (var it = 0; it < 80; it++) {
      var moved = false;
      for (var i = 0; i < ids.length; i++) for (var j = i + 1; j < ids.length; j++) {
        var a = byId[ids[i]], b = byId[ids[j]];
        if (keep[a.id + '|' + b.id] || keep[b.id + '|' + a.id]) continue;
        var ea = halfExt(a), eb = halfExt(b), pa = P[a.id], pb = P[b.id];
        var ox = ea[0] + eb[0] + gap - Math.abs(pb[0] - pa[0]), oy = ea[1] + eb[1] + gap - Math.abs(pb[1] - pa[1]);
        if (ox <= 0 || oy <= 0) continue;
        // круги расходятся по линии центров, листы — по оси меньшего перекрытия
        var dx = pb[0] - pa[0], dy = pb[1] - pa[1], d = Math.hypot(dx, dy) || 1, push;
        if (a.shape === 'disc' && b.shape === 'disc') { push = a.w / 2 + b.w / 2 + gap - d; if (push <= 0) continue; dx /= d; dy /= d; }
        else if (ox < oy) { push = ox; dx = dx >= 0 ? 1 : -1; dy = 0; } else { push = oy; dy = dy >= 0 ? 1 : -1; dx = 0; }
        var wa = a.fixed ? 0 : 1 / Math.max(1, a.w * a.h), wb = b.fixed ? 0 : 1 / Math.max(1, b.w * b.h), ws = wa + wb;
        if (!ws) continue;
        pa[0] -= dx * push * wa / ws * 0.5; pa[1] -= dy * push * wa / ws * 0.5;
        pb[0] += dx * push * wb / ws * 0.5; pb[1] += dy * push * wb / ws * 0.5;
        moved = true;
      }
      if (!moved) break;
    }
    // обратно в векторы подвеса (в покое углы нулевые, вектор = разность позиций)
    M.chain.forEach(function (c) { if (c.parent) { var q = P[c.id], r = P[c.parent]; c.rest = [q[0] - r[0], q[1] - r[1]]; } });
    return M;
  }

  // вход сцены
  function run(scene, opt) {
    RELIEF_APP.run({
      id: scene.id, title: scene.title, blurb: scene.blurb, hint: scene.hint, rows: scene.rows || {},
      hotkeys: scene.hotkeys,
      draw: function (ctx) { draw(ctx, scene); },
      capture: function (ctx) {

        S.G = null; S.key = '';

      }
    }, opt);
  }

  window.ORG = { run: run, state: S, bez: bez, sag: sag, fk: fk, hash: hash, rot: rot, unit: unit, chainLinks: chainLinks, fitModel: fitModel, relax: relax };
})();

<script>
/* lab/desk/_core/widgets.js */
// widgets.js — печать данных книги на листах и дисках (координаты листа: центр в 0, ширина w, высота h).

(function () {

    K.font(g, F, o);

    gate: function (g, F, I, w, h) {

    },
    // столбцы 12 месяцев: печатные пилюли целиком скруглённые, сетка под ними рельефом

        var hh = (y1 - y0) * q / hi, bx = x0 + i * bw + bw * 0.18, ww = bw * 0.64;

    // диск стадии: подпись и сумма по центру, площадь диска = объём
    stage: function (node) {
