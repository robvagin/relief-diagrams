<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>{{TITLE}}</title>
<style>
{{FONTS}}
/* токены сцены RELIEF (§8, §6.7): единственное место хексов сцены */
:root{--r-ground:#f0ece4;--r-plate:#f4f1ea;--r-ink:#191713;--r-ink2:#44423e;--r-ink3:#65635e;--r-shadow:#464e58;--r-light:#fff9e8;--r-acc-terracotta:#c16139;--r-acc-cobalt:#345fb2;--r-acc-olive:#70843c;color-scheme:light}
html.is-night{--r-ground:#13110e;--r-plate:#171512;--r-ink:#ebe7e0;--r-ink2:#c0bdb8;--r-ink3:#94928d;--r-shadow:#000102;--r-light:#ffefd8;--r-acc-terracotta:#d2764a;--r-acc-cobalt:#638bd5;--r-acc-olive:#889c54;color-scheme:dark}
{{PANEL_CSS}}
/* оболочка варианта: сцена слева, панель справа 300 px; < 768 px нижний лист, открыт всегда */
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--r-ground)}
body{font-family:Geist,system-ui,sans-serif;overflow:hidden}
.app{display:grid;grid-template-columns:minmax(0,1fr) 300px;height:100vh;height:100dvh}
.stage{position:relative;min-width:0;min-height:0;overflow:hidden}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-y}
.panel{min-width:0;min-height:0;overflow:auto;overscroll-behavior:contain;background:var(--bg)}
.pv2-root{padding:12px 12px 16px;display:flex;flex-direction:column;gap:12px;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans)}
.pv2-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:2px 0 0}
.pv2-head b{font:600 var(--t3)/1.2 var(--display);color:var(--ink)}
.pv2-head span{font:500 var(--t1)/1 var(--mono);color:var(--ink3);letter-spacing:var(--track-s)}
.pv2 fieldset{display:block;margin:0;padding:8px 10px 10px;border:0;border-radius:var(--r-card);background:var(--card);min-width:0}
.pv2 legend{display:block;padding:0 0 8px;font:500 var(--t1)/1 var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--ink3)}
.pv2-foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.pv2 .sw{cursor:pointer}.pv2 .seg button{cursor:pointer}
html.is-embed .app{grid-template-columns:minmax(0,1fr)}
html.is-embed .panel{display:none}
@media (max-width:767px){
  body{overflow:auto}
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:62vh auto;height:auto;min-height:100vh}
  .panel{overflow:visible;box-shadow:0 -8px 24px var(--shadow)}
  html.is-embed .app{grid-template-rows:100vh}
}
@media (prefers-reduced-motion:reduce){.pv2 *{transition:none!important}}
</style>
<script>
/* до первого fit(): класс фрагмента и ночи ставится сразу, чтобы холст не прыгал */
(function(){var q=new URLSearchParams(location.search),e=q.get('embed')==='1'||q.has('noui')||q.get('panel')==='off';
document.documentElement.classList.toggle('is-embed',e);document.documentElement.classList.toggle('is-night',q.get('theme')==='night');})();
</script>
</head>
<body>
<div class="app">
  <div class="stage" id="stage"><canvas id="scene"></canvas></div>
  <aside class="panel" id="panel" data-panel aria-label="Controls"></aside>
</div>
{{SCRIPTS}}
</body>
</html>
