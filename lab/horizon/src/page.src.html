<!--@pv2-css-->
<style>
.pv2,.pv2 *,.pv2 *::before,.pv2 *::after{box-sizing:border-box}
.pv2 .scrub .sval{-webkit-appearance:none;appearance:none}
html,body{margin:0;height:100%;background:var(--r-ground);overflow:hidden}
.app{position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,1fr) 300px}
#stage{position:relative;min-width:0;min-height:0}
#stage canvas{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#panel{min-width:0;min-height:0;overflow:hidden}
#panel .pv2-panel{height:100%;box-sizing:border-box;overflow:auto;padding:12px 12px 16px;background:var(--bg);color:var(--ink);font-family:var(--sans)}
.pv2 fieldset.grp{border:0;margin:0 0 14px;padding:0;min-width:0}
.pv2 fieldset.grp legend{padding:0 0 6px;font:500 var(--t1)/1.2 var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--ink3)}
.pv2 .acts{display:flex;gap:8px;flex-wrap:wrap;padding-top:4px}
@media (max-width:767px){.app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) 44vh}}
html.is-embed .app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
html.is-embed #panel{display:none}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.pv2 *{transition:none!important}}
</style></head><body>
<div class="app"><div id="stage"><canvas id="c"></canvas></div><aside id="panel" data-panel aria-label="Controls"></aside></div>
