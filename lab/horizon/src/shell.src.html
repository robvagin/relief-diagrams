<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data: blob:; font-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>{{TITLE}}</title>
<style>
/* Токены сцены README §8. Хексы живут ТОЛЬКО здесь; хром панели держит свои (.pv2). */
:root{
  --sc-ground:#f0ece4; --sc-plate:#f4f1ea; --sc-ink:#191713; --sc-ink2:#44423e; --sc-ink3:#65635e;
  --sc-shadow:#464e58; --sc-light:#fff9e8; --sc-line-a:.22;
  --sc-acc-terracotta:#c16139; --sc-acc-cobalt:#345fb2; --sc-acc-olive:#70843c;
}
html.is-night{
  --sc-ground:#13110e; --sc-plate:#171512; --sc-ink:#ebe7e0; --sc-ink2:#c0bdb8; --sc-ink3:#94928d;
  --sc-shadow:#000102; --sc-light:#ffefd8; --sc-line-a:.26;
  --sc-acc-terracotta:#d2764a; --sc-acc-cobalt:#638bd5; --sc-acc-olive:#889c54;
}
{{FONTS}}
html,body{margin:0;height:100%;background:var(--sc-ground);overflow:hidden}
#stage{position:fixed;left:0;top:0;bottom:0;right:300px}
canvas{display:block;width:100%;height:100%;touch-action:none}
#panel{position:fixed;right:0;top:0;bottom:0;width:300px;overflow:auto;overscroll-behavior:contain}
#panel .pv2,#panel .pv2 *,#panel .pv2 *::before,#panel .pv2 *::after{box-sizing:border-box}
#panel .pv2{min-height:100%;box-sizing:border-box;padding:16px 16px 24px;background:var(--bg);color:var(--ink);font-family:var(--sans)}
.pv2 fieldset{border:0;margin:0 0 16px;padding:0;min-width:0}
.pv2 legend{padding:0;margin:0 0 8px;font:500 var(--t1)/1.2 var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--ink3)}
.pv2 .acts{display:flex;gap:8px;margin-top:8px}
.pv2 .scrub .sval{appearance:none;-webkit-appearance:none}
@media (max-width:767px){
  #stage{right:0;bottom:44vh}
  #panel{top:auto;left:0;width:auto;height:44vh}
}
html.is-embed #stage{right:0;bottom:0}
html.is-embed #panel{display:none}
@media (prefers-reduced-motion:reduce){.pv2 *{transition:none!important}}
</style>
<style>
{{PANEL_CSS}}
</style>
</head><body>
<div id="stage"><canvas id="c"></canvas></div>
