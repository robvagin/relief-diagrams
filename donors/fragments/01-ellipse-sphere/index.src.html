<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data: blob:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Фрагмент 01 · сфера из эллипсов</title>
<style>
/* Токены страницы. Хексы живут ТОЛЬКО здесь: хост перекрашивает фрагмент,
   не трогая сцену (закон 3). */
:root{
  --paper:#f6f5f2; --panel:#fdfdfc; --ink:#1a1a1a; --muted:#6f6d67;
  --line:#dcdad4; --accent:#0b0b0c;
}
html.is-night{ --paper:#1F1C17; --panel:#26231d; --ink:#F4F0E3; --muted:#A6A19B;
  --line:rgba(244,240,227,.22); --accent:#C7A985; }
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);
  font:11px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace}
#stage{position:absolute;inset:0}
canvas{display:block;width:100%;height:100%}
#panel{position:fixed;right:16px;top:16px;max-height:calc(100% - 32px)}
html.is-embed #panel{display:none}
</style></head><body>
<div id="stage"><canvas id="c"></canvas></div>
<div id="panel" data-panel></div>

<script src="../../kit/kit-panel.js"></script>
<script src="../../kit/kit-scene.js"></script>
<script>
/* Фрагмент 01 · сфера из эллипсов.
   Вынуто из движка стопки: стопка эллипсов читается как глобус только если
   у неё есть ТРИ вещи, а не одна. Наклон задаёт сплюснутость сечения; глобус
   меняет РАСПРЕДЕЛЕНИЕ слоёв по высоте (внизу шаг короче, разворот сильнее),
   не трогая габарит; крен вращает и позиции, и сами эллипсы одним углом,
   иначе тело разъезжается на несогласованные части.
   Толщина рисуется вторым контуром со сдвигом по вектору крена — это стенка
   блинчика, а не тень. Дыхание — амбиентная петля, ничего не дёргает рывком. */
KIT.scene.register({
  id: 'ellipse-sphere',
  title: 'Сфера из эллипсов',
  blurb: 'Стопка эллипсов, собранная в глобус перспективой, креном и распределением слоёв.',
  params: [
    ['layers', 'Слоёв',      6, 96, 1,   34],
    ['radius', 'Радиус',  0.08, 0.48, 0.005, 0.30],
    ['height', 'Высота',  0.05, 0.60, 0.005, 0.30],
    ['tilt',   'Наклон',     2, 80, 1,    26],
    ['globe',  'Глобус',     0, 60, 1,    34],
    ['roll',   'Крен',     -60, 60, 1,     0],
    ['wall',   'Стенка',     0, 1,  0.01, 0.30],
    ['breathe','Дыхание',    0, 0.3, 0.005, 0.06],
    ['period', 'Период',     2, 30, 0.5,   12],
    ['accentAt','Акцент',    0, 96, 1,     0],
    ['jitter', 'Разброс',   0, 1,  0.01, 0.18],
    ['fillTop','Заливка',    0, 1,  1,     0]
  ],
  presets: [{ schema: 1, id: 'hero', engine: 'ellipse-sphere', seed: 'arsenal',
              values: { layers: 34, tilt: 26, globe: 34, wall: 0.30 } }],
  init: function (ctx) {
    const cs = getComputedStyle(document.documentElement);
    ctx.pal = {
      ink: cs.getPropertyValue('--ink').trim(),
      line: cs.getPropertyValue('--line').trim(),
      accent: cs.getPropertyValue('--accent').trim(),
      paper: cs.getPropertyValue('--paper').trim()
    };
  },
  draw: function (ctx) {
    const g = ctx.g, P = ctx.P, W = ctx.W, H = ctx.H;
    const S = Math.min(W, H), cx = W / 2, cy = H / 2;
    const D2R = Math.PI / 180, TAU = Math.PI * 2;
    g.clearRect(0, 0, W, H);

    const L = Math.max(2, Math.round(P.layers));
    const cosT = Math.cos(Math.max(2, Math.min(80, P.tilt)) * D2R);
    // дыхание: медленная петля по номеру кадра, а не по часам
    const br = P.breathe * Math.sin(TAU * (ctx.t / 60) / Math.max(1, P.period));
    const R = P.radius * S;
    const vSpan = P.height * S * cosT * (1 + br);
    const roll = Math.max(-60, Math.min(60, P.roll)) * D2R;
    const cosR = Math.cos(roll), sinR = Math.sin(roll);
    const wallPx = Math.max(0, P.wall * (2 * vSpan) / L);
    const wx = -wallPx * sinR, wy = wallPx * cosR;
    const globe = Math.max(0, Math.min(60, P.globe)) / 60;

    for (let i = 0; i < L; i++) {
      // k от -1 до 1 по стопке; глобус подтягивает слои к экватору, оставляя
      // габарит на месте — меняется распределение, а не высота тела
      let k = (L === 1) ? 0 : (i / (L - 1)) * 2 - 1;
      const kg = Math.sin(k * Math.PI / 2);
      k = k * (1 - globe) + kg * globe;

      const y = k * vSpan;
      // сечение шара на высоте k: полуось по горизонтали
      const A = R * Math.sqrt(Math.max(0, 1 - k * k));
      const B = Math.max(0.4, A * (1 - cosT * 0.92));
      if (A < 0.6) continue;

      // разброс по сиду: живая неровность вместо ровной сетки слоёв.
      // Ровные интервалы и симметрия без причины читаются как «сгенерировано».
      const jx = (ctx.rand() - 0.5) * P.jitter * (A * 0.10 + 2);
      const jy = (ctx.rand() - 0.5) * P.jitter * (B * 0.35 + 1.5);
      const jr = (ctx.rand() - 0.5) * P.jitter * 0.10;
      const px = cx + y * sinR + jx, py = cy + y * cosR + jy;
      const rot = roll + jr;
      const far = (1 - Math.abs(k)) * 0.55 + 0.45;     // глубина — альфой, не толщиной

      if (wallPx > 0.3) {                              // стенка блинчика
        g.beginPath();
        g.globalAlpha = 0.5 * far;
        g.strokeStyle = ctx.pal.line;
        g.lineWidth = 1;
        g.ellipse(px + wx, py + wy, A, B, rot, 0, TAU);
        g.stroke();
      }

      const isAccent = P.accentAt > 0 && i === Math.min(L - 1, Math.round(P.accentAt) - 1);
      if (P.fillTop && isAccent) {
        g.beginPath();
        g.globalAlpha = 0.14;
        g.fillStyle = ctx.pal.accent;
        g.ellipse(px, py, A, B, rot, 0, TAU);
        g.fill();
      }
      g.beginPath();
      g.globalAlpha = isAccent ? 1 : far;
      g.strokeStyle = isAccent ? ctx.pal.accent : ctx.pal.ink;
      g.lineWidth = 1;                                  // перо не масштабируется
      g.ellipse(px, py, A, B, rot, 0, TAU);
      g.stroke();
    }
    g.globalAlpha = 1;
  }
});

KIT.scene.start({ canvas: document.getElementById('c'), panelMount: document.getElementById('panel') });
</script></body></html>
