<!doctype html>
<!--
  Hexbin — Skeleton v4 (canon+). Дешборд-тип: ПЛОТНОСТЬ big-data как ОБЪЁМ.
  Точки → гекс-биннинг → каждая ячейка ВЫДАВЛИВАЕТСЯ в столбец высотой ∝ count.
  Полный наклон (можно смотреть сверху «как дома»), глобальная per-face сортировка
  (ближние башни честно перекрывают дальние), пресеты/Look, вариатив формы.
    Presets · Look(Clean/Detailed) · Style · Palette · Height map · Sides · Roundness · Size range · Min height
    drag — вращение (tilt без ограничений) · гизмо низ-право · клик — count · H — UI
-->
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hexbin — Skeleton</title>
<style>
  :root{ --paper:#f4f3f0; --ink:#1a1a1a; --muted:#8b8880; --line:#dcdad4; --accent:#f0435c; --panel:#fdfdfc; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink)}
  canvas{display:block;cursor:grab}canvas:active{cursor:grabbing}
  #panel{position:fixed;top:16px;left:16px;width:272px;max-height:calc(100vh - 32px);background:var(--panel);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;overflow:hidden;z-index:10}
  #tabs{display:flex;border-bottom:1px solid var(--line)}
  #tabs button{flex:1;padding:10px 0;background:none;border:0;font:inherit;color:var(--muted);cursor:pointer;text-transform:uppercase;letter-spacing:.06em;font-size:10px}
  #tabs button[aria-selected="true"]{color:var(--ink);box-shadow:inset 0 -2px var(--ink)}
  #body{overflow-y:auto;padding:12px 14px 16px}
  .tab{display:none}.tab.on{display:block}
  fieldset{border:0;margin:0 0 14px;padding:0}
  legend{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:8px;cursor:pointer;user-select:none}
  legend::before{content:'▾ ';font-size:8px;color:var(--muted)}fieldset.closed>legend::before{content:'▸ '}fieldset.closed>*:not(legend){display:none}
  .row{display:grid;grid-template-columns:1fr 64px 48px;gap:8px;align-items:center;margin:5px 0}
  .row label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row input[type=range]{width:100%;accent-color:var(--ink);height:2px}
  .row input[type=number]{width:100%;font:10px ui-monospace,monospace;color:var(--muted);background:var(--paper);border:1px solid var(--line);border-radius:4px;text-align:right;padding:3px 4px}
  .row input[type=number]:focus{color:var(--ink);outline:none;border-color:var(--ink)}.row input[type=number]::-webkit-inner-spin-button{display:none}
  .row.toggle{grid-template-columns:1fr auto}
  .selrow{display:grid;grid-template-columns:1fr 1.35fr;gap:8px;align-items:center;margin:6px 0}
  .selrow label{color:var(--muted)}
  .seg{display:flex;gap:4px;margin:2px 0 4px;flex-wrap:wrap}
  .seg button{flex:1 0 auto;min-width:52px;font:inherit;font-size:10px;padding:6px 6px;background:var(--paper);border:1px solid var(--line);border-radius:6px;cursor:pointer;color:var(--ink);text-transform:uppercase;letter-spacing:.03em}
  .seg button[aria-pressed="true"]{border-color:var(--ink);background:var(--panel)}
  .look{display:flex;gap:4px;margin:0 0 9px}
  .look button{flex:1;font:inherit;font-size:10px;padding:5px;background:var(--paper);border:1px solid var(--line);border-radius:6px;cursor:pointer;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .look button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink)}
  .sw{appearance:none;-webkit-appearance:none;width:30px;height:16px;margin:0;cursor:pointer;border:1px solid var(--line);border-radius:99px;background:var(--paper);position:relative}
  .sw::before{content:'';position:absolute;top:2px;left:2px;width:10px;height:10px;border-radius:50%;background:var(--muted);transition:left .15s,background .15s}
  .sw:checked{border-color:var(--ink);background:var(--ink)}.sw:checked::before{left:16px;background:var(--paper)}
  .btn{padding:7px 10px;font:inherit;font-size:11px;background:none;border:1px solid var(--line);border-radius:6px;cursor:pointer;color:var(--ink);margin:3px 4px 3px 0}
  .btn:hover{border-color:var(--ink)}.btn.acc{border-color:var(--accent);color:var(--accent)}
  .note{color:var(--muted);font-size:10px;margin:6px 0}
  .tin{font:10px ui-monospace,monospace;border:1px solid var(--line);border-radius:4px;background:var(--paper);color:var(--ink);padding:5px 6px;width:100%}
  .mpad{position:relative;width:100%;aspect-ratio:1;touch-action:none;cursor:crosshair;margin:2px 0 4px}
  .mpad canvas{position:absolute;inset:0;width:100%;height:100%;border:1px solid var(--line);border-radius:6px;background:#fff}
  .mcn{position:absolute;font-size:9px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;pointer-events:none;user-select:none}
  .mcn.nw{left:7px;top:6px}.mcn.ne{right:7px;top:6px}.mcn.sw{left:7px;bottom:6px}.mcn.se{right:7px;bottom:6px}
  .mprev{position:relative;height:40px;background:var(--paper);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-top:6px}
  .mprev canvas{position:absolute;inset:0;width:100%;height:100%}
  #mtrans{position:fixed;bottom:34px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:11}
  #mtrans button{font:inherit;font-size:10px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:6px 12px;cursor:pointer;text-transform:uppercase;letter-spacing:.05em}
  #mtrans button[aria-pressed="true"]{border-color:var(--ink)}
  #mtrans .msp{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:4px 12px}
  #mtrans .msp label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  #mtrans .msp input[type=range]{width:74px;accent-color:var(--ink);height:2px}
  #hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);color:var(--muted);font-size:10px;z-index:5;pointer-events:none}
  body.noui #panel,body.noui #hint,body.noui #mtrans{display:none}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="panel">
  <div id="tabs"><button data-tab="scene" aria-selected="true">Scene</button><button data-tab="data">Data</button><button data-tab="io">Export</button></div>
  <div id="body">
    <div class="tab on" data-tab="scene">
      <fieldset><legend>Presets</legend><div class="seg" id="presetSeg"></div></fieldset>
      <fieldset id="gHex"><legend>Hex towers</legend>
        <div class="look" id="lookSeg"><button data-look="clean" aria-pressed="true">Clean</button><button data-look="detailed">Detailed</button></div>
        <div class="selrow"><label>Style</label><select class="tin" id="selStyle">
          <option value="towers">Towers — сплошные</option><option value="floors">Floors — многоэтажные</option><option value="peaks">Peaks — конусы</option></select></div>
        <div class="selrow"><label>Palette</label><select class="tin" id="selPalette">
          <option value="gray">Gray</option><option value="accent">Accent ramp</option><option value="ink">Ink ramp</option></select></div>
        <div class="selrow"><label>Height map</label><select class="tin" id="selHmap">
          <option value="linear">Linear</option><option value="sqrt">Sqrt — сжать пики</option><option value="log">Log — big-data</option></select></div>
      </fieldset>
      <fieldset id="gMotion"><legend>Motion pad</legend>
        <div class="mpad" id="mpad"><canvas id="mpadc"></canvas>
          <span class="mcn nw">soft</span><span class="mcn ne">raw</span><span class="mcn sw">slow</span><span class="mcn se">fast</span></div>
        <div id="gMotionSliders"></div>
        <div style="margin-top:7px"><select class="tin" id="mEase">
          <option value="balanced">Balanced — центр</option><option value="slow">Slow — плавный старт/стоп</option>
          <option value="fast">Fast — быстрый доводчик</option><option value="soft">Soft — глубокая подушка</option>
          <option value="raw">Raw — линейный</option><option value="gentle">Gentle — мягко</option><option value="snappy">Snappy — резко и живо</option></select></div>
        <div class="mprev"><canvas id="mprevc"></canvas></div>
      </fieldset>
      <fieldset id="gCam" class="closed"><legend>Camera</legend></fieldset>
    </div>
    <div class="tab" data-tab="data"><fieldset><legend>Title</legend><input class="tin" id="nTitle"></fieldset>
      <fieldset id="gData"><legend>Point cloud (seeded)</legend></fieldset><button class="btn" id="reseed">Reseed ⟳</button>
      <p class="note">Каркас на генеративном облаке. В проде — реальные данные (Data-рельс: CSV/JSON/live).</p></div>
    <div class="tab" data-tab="io">
      <fieldset><legend>Config</legend><button class="btn" id="saveCfg">Save JSON</button><button class="btn" id="loadCfg">Load JSON</button><input type="file" id="loadFile" accept=".json" hidden></fieldset>
      <fieldset><legend>Image</legend><button class="btn acc" id="svgBtn">Export SVG</button><button class="btn" id="pngBtn">Export PNG</button></fieldset>
      <fieldset><legend>UI</legend><button class="btn" id="hideBtn">Hide UI (H)</button></fieldset></div>
  </div>
</div>
<div id="hint">drag — вращение (наклон без ограничений, можно смотреть сверху) · гизмо низ-право · клик — count · H — UI</div>
<div id="mtrans"><button id="mReplay">⟲ Replay</button><button id="mLoop" aria-pressed="false">Loop</button><span class="msp"><label>Hold</label><input type="range" id="mHold" min="0.3" max="12" step="0.1" value="1.6"></span></div>

<script>
/* ================= @core-begin — чистая математика, без DOM ================= */
const TAU=Math.PI*2;
function rng(seed){ let s=(seed>>>0)||1; return ()=>{ s=(s*1664525+1013904223)>>>0; return s/4294967296; }; }
function genPoints(count,clusters,seed){ const r=rng(seed),cs=[]; for(let k=0;k<clusters;k++)cs.push({x:(r()*2-1)*0.72,y:(r()*2-1)*0.72,s:0.08+r()*0.26});
  const g=()=>(r()+r()+r()+r()-2)/2, pts=[]; for(let i=0;i<count;i++){const c=cs[Math.floor(r()*clusters)]||cs[0];pts.push([c.x+g()*c.s,c.y+g()*c.s]);} return pts; }
function hexBin(pts,r){ const dx=r*2*Math.sin(Math.PI/3),dy=r*1.5,bins=new Map();
  for(const [x,y] of pts){ let py=y/dy,pj=Math.round(py),px=x/dx-(pj&1?0.5:0),pi=Math.round(px);const py1=py-pj;
    if(Math.abs(py1)*3>1){const px1=px-pi,pi2=pi+(px<pi?-1:1)/2,pj2=pj+(py<pj?-1:1),px2=px-pi2,py2=py-pj2;if(px1*px1+py1*py1>px2*px2+py2*py2){pi=pi2+(pj&1?1:-1)/2;pj=pj2;}}
    const key=pi+','+pj;let b=bins.get(key);if(!b){b={x:(pi+(pj&1?0.5:0))*dx,y:pj*dy,count:0};bins.set(key,b);}b.count++; }
  return [...bins.values()]; }
// правильный n-угольник → опционально скруглённые углы (round 0=острый … 1=почти круг)
function polyVerts(R,n){ const v=[]; for(let i=0;i<n;i++){const a=TAU*i/n;v.push([Math.sin(a)*R,-Math.cos(a)*R]);} return v; }
function footprint(R,n,round){ n=Math.max(3,Math.round(n)); const V=polyVerts(R,n); if(!(round>0.001))return V;
  const out=[],K=4,sub=(a,b)=>[a[0]-b[0],a[1]-b[1]],ln=a=>Math.hypot(a[0],a[1]);
  for(let i=0;i<n;i++){ const p=V[(i+n-1)%n],c=V[i],q=V[(i+1)%n],dp=sub(p,c),dq=sub(q,c),lp=ln(dp),lq=ln(dq),cut=Math.min(lp,lq)*0.5*round;
    const a1=[c[0]+dp[0]/lp*cut,c[1]+dp[1]/lp*cut],a2=[c[0]+dq[0]/lq*cut,c[1]+dq[1]/lq*cut]; out.push(a1);
    for(let s=1;s<K;s++){const t=s/K;out.push([(1-t)*(1-t)*a1[0]+2*(1-t)*t*c[0]+t*t*a2[0],(1-t)*(1-t)*a1[1]+2*(1-t)*t*c[1]+t*t*a2[1]]);} out.push(a2); }
  return out; }
function rotX(p,a){const c=Math.cos(a),s=Math.sin(a);return{x:p.x,y:p.y*c-p.z*s,z:p.y*s+p.z*c};}
function rotY(p,a){const c=Math.cos(a),s=Math.sin(a);return{x:p.x*c+p.z*s,y:p.y,z:-p.x*s+p.z*c};}
const lerp=(a,b,t)=>a+(b-a)*t; const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function hmap(t,mode){ t=clamp(t,0,1); if(mode==='sqrt')return Math.sqrt(t); if(mode==='log')return Math.log1p(t*9)/Math.log(10); return t; }
/* --- @motion-core --- */
const _mc=v=>v<0?0:v>1?1:v;
const ARCHETYPES={ slow:{speed:0.55,ease:t=>0.5*(1-Math.cos(Math.PI*t))}, fast:{speed:1.90,ease:t=>1-Math.pow(1-t,3)},
  soft:{speed:0.85,ease:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}, raw:{speed:1.30,ease:t=>t} };
function motionResolve(x,y){ x=_mc(x);y=_mc(y); const w={slow:(1-x)*(1-y),fast:x*(1-y),soft:(1-x)*y,raw:x*y},A=ARCHETYPES;
  const speed=w.slow*A.slow.speed+w.fast*A.fast.speed+w.soft*A.soft.speed+w.raw*A.raw.speed;
  const ease=t=>{t=_mc(t);return w.slow*A.slow.ease(t)+w.fast*A.fast.ease(t)+w.soft*A.soft.ease(t)+w.raw*A.raw.ease(t);};
  return {speed,ease}; }
function speedToX(target,y){ const A=ARCHETYPES,left=(1-y)*A.slow.speed+y*A.soft.speed,right=(1-y)*A.fast.speed+y*A.raw.speed;
  return Math.abs(right-left)<1e-6?0.5:_mc((target-left)/(right-left)); }
function revealFactors(t,easeFn,hold){ const c01=x=>x<0?0:x>1?1:x, E=x=>easeFn?easeFn(c01(x)):c01(x);
  const S=0.5, RISE=1.0, HOLD=hold!=null?hold:1.6, holdEnd=S+RISE+HOLD, EXIT=0.7, GAP=0.5, cycle=holdEnd+EXIT+GAP;
  let exitK=0; if(state.anim.loop){ t=((t%cycle)+cycle)%cycle; if(t>holdEnd)exitK=c01((t-holdEnd)/EXIT); } else if(t>holdEnd)t=holdEnd;
  const keep=1-E(exitK);
  return { baseK:E(t/S)*keep, rise:d=>E((t-S-d*0.5*RISE)/(RISE*0.5))*keep, labK:E((t-S-0.35)/0.4)*keep,
    yawOff:(1-E(t/S))*Math.PI*0.5 - E(exitK)*Math.PI*0.35, tiltOff:(1-E(t/S))*(14*Math.PI/180) }; }
/* ================= @core-end ================= */

const DEFAULTS={ size:0.075, height:0.6, minH:0, style:'towers', palette:'gray', hmap:'linear',
  sides:6, round:0, sizeVar:0, floors:4, taper:0, gLight:0.82, gDark:0.22, side:0.7, edges:1, base:1, invert:0 };
const state={ hex:{...DEFAULTS}, cam:{ tilt:-28, yaw:12, dist:3.4 },   // дом: вид сверху ¾ (видны крышки)
  data:{ title:"Плотность", count:6000, clusters:5, seed:7 },
  motion:{ x:0.5, y:0.5, speed:1 }, anim:{ t:0, loop:0, hold:1.6 }, sel:null };
/* пресеты: масштаб × вариант построения × ракурс (комбинаторика) */
const PRESETS={
  'Towers':{hex:{style:'towers',size:0.075,sizeVar:0,sides:6,round:0,minH:0,taper:0,floors:4,palette:'gray',hmap:'linear',height:0.6},cam:{tilt:-28,dist:3.4}},
  'Blocks':{hex:{style:'towers',size:0.115,sizeVar:0.35,sides:6,round:0.18,minH:0.28,taper:0,palette:'gray',hmap:'sqrt',height:0.5},cam:{tilt:-58,dist:3.1}},
  'City':{hex:{style:'floors',size:0.055,floors:5,sizeVar:0.2,sides:6,round:0,minH:0.16,taper:0,palette:'gray',hmap:'log',height:0.72},cam:{tilt:-40,dist:3.0}},
  'Peaks':{hex:{style:'peaks',size:0.07,sizeVar:0,sides:6,round:0,minH:0,taper:0.82,palette:'gray',hmap:'linear',height:0.95},cam:{tilt:-26,dist:3.6}},
  'Round':{hex:{style:'towers',size:0.09,sizeVar:0.25,sides:10,round:1,minH:0.1,taper:0,palette:'gray',hmap:'sqrt',height:0.62},cam:{tilt:-32,dist:3.3}}
};
const LOOKS={ clean:{'hex.edges':0,'hex.base':0}, detailed:{'hex.edges':1,'hex.base':1} };

const cv=document.getElementById('cv'),ctx=cv.getContext('2d'); let W=0,H=0;
function resize(){const dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);}
addEventListener('resize',resize);
const css=v=>getComputedStyle(document.body).getPropertyValue(v).trim();
const INK=css('--ink'),MUTED=css('--muted'),ACC=css('--accent'),PAPER=css('--paper');
const gray=g=>{const v=Math.round(clamp(g,0,1)*255);return `rgb(${v},${v},${v})`;};
function hexRGB(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');return{r:parseInt(h.slice(0,2),16),g:parseInt(h.slice(2,4),16),b:parseInt(h.slice(4,6),16)};}
function mix(a,b,t){const c=typeof a==='string'?hexRGB(a):a,d=typeof b==='string'?hexRGB(b):b;return `rgb(${Math.round(lerp(c.r,d.r,t))},${Math.round(lerp(c.g,d.g,t))},${Math.round(lerp(c.b,d.b,t))})`;}
function colFor(t){ const u=state.hex.invert?1-t:t;
  if(state.hex.palette==='gray'){ const v=lerp(state.hex.gLight,state.hex.gDark,u); return {top:gray(v),side:gray(v*state.hex.side)}; }
  const to=state.hex.palette==='accent'?ACC:INK, top=mix(PAPER,to,0.14+0.86*u), side=mix(top,'#000000',(1-state.hex.side)*0.55);
  return {top,side}; }

let dirty=true, bins=[], maxC=1;
function rebuild(){ bins=hexBin(genPoints(Math.round(state.data.count),Math.round(state.data.clusters),state.data.seed), state.hex.size);
  maxC=bins.reduce((m,b)=>Math.max(m,b.count),1);
  let cx=0,cy=0; for(const b of bins){cx+=b.x;cy+=b.y;} cx/=bins.length||1; cy/=bins.length||1;
  let mr=1e-6; for(const b of bins){ b._r=Math.hypot(b.x-cx,b.y-cy); if(b._r>mr)mr=b._r; }
  for(const b of bins) b.d=b._r/mr; dirty=false; }
function cam(){ const c=state.cam; return {yaw:c.yaw*Math.PI/180, tilt:c.tilt*Math.PI/180, dist:c.dist, fov:Math.min(W,H)/2.6*c.dist}; }
function vT(v,cm){ return rotX(rotY(v,cm.yaw),cm.tilt); }
function toScr(x,y,z,cm){ const q=vT({x,y,z},cm); const s=cm.fov/(cm.dist+q.z); return {x:W/2+q.x*s, y:H/2-q.y*s, z:q.z}; }

let hitCols=[], lastT=performance.now();
/*
  СЛОИ (стабильно со всех сторон):
   • МЕЖДУ столбцами — ключ = view-z НАЗЕМНОГО центра (y=0), БЕЗ высоты. Наземная глубина —
     инвариант: не зависит от того, смотрим сверху или снизу, и не «прыгает» при вращении
     (высота в ключ не входит). Далёкий по земле столбец рисуется раньше ближнего.
   • ВНУТРИ столбца — все его грани (боковые + этажи + верх/низ крышки) сортируются по своей z
     far→near. Выпуклая призма: дальняя крышка и задние грани уходят назад, ближние — вперёд.
   • Нижняя крышка добавлена → корректно и когда крутим до вида снизу.
*/
function buildFaces(cm,R){
  const cols=[]; hitCols=[];
  const HX=state.hex, taper=(HX.style==='peaks')?Math.max(HX.taper,0.82):HX.taper, floors=(HX.style==='floors')?Math.max(2,Math.round(HX.floors)):1;
  const edges=HX.edges;
  for(const b of bins){ const t=hmap(b.count/maxC,HX.hmap);
    const rad=Math.max(0.012, HX.size*(1+HX.sizeVar*(t-0.5)));   // footprint ∝ плотности (Size range)
    const h=HX.height*(HX.minH+(1-HX.minH)*t)*(R?R.rise(b.d):1); // Min height = порог роста
    const fpB=footprint(rad,HX.sides,HX.round), fpT=footprint(rad*(1-taper),HX.sides,HX.round), M=fpB.length;
    const bot=fpB.map(v=>toScr(b.x+v[0],0,b.y+v[1],cm)), top=fpT.map(v=>toScr(b.x+v[0],h,b.y+v[1],cm));
    const bc=toScr(b.x,0,b.y,cm), tc=toScr(b.x,h,b.y,cm); hitCols.push({b,sx:tc.x,sy:tc.y});
    const {top:cTop,side:cSide}=colFor(t), selTop=(state.sel===b);
    const cf=[]; const avg=a=>{let s=0;for(const p of a)s+=p.z;return s/a.length;};
    if(h>0.001){ for(let i=0;i<M;i++){ const j=(i+1)%M, pts=[bot[i],bot[j],top[j],top[i]];
        cf.push({pts, fill:cSide, so:edges?0.10:0, z:(bot[i].z+bot[j].z+top[i].z+top[j].z)/4}); }
      if(floors>1){ for(let k=1;k<floors;k++){ const f=k/floors, ring=footprint(rad*(1-taper*f),HX.sides,HX.round).map(v=>toScr(b.x+v[0],h*f,b.y+v[1],cm));
          cf.push({pts:ring, fill:null, so:0.13, z:avg(ring)}); } }
      cf.push({pts:bot, fill:cSide, so:edges?0.10:0, z:avg(bot)}); }        // нижняя крышка
    cf.push({pts:top, fill:selTop?ACC:cTop, so:edges?0.14:0, z:avg(top)});   // верхняя крышка
    cf.sort((a,c)=>c.z-a.z);                                                 // грани столбца far→near
    cols.push({key:bc.z, cf});                                               // ключ = НАЗЕМНАЯ глубина
  }
  cols.sort((a,c)=>c.key-a.key);                                            // столбцы far→near (стабильно)
  const faces=[]; for(const col of cols) for(const f of col.cf) faces.push(f);
  return faces;
}
function frame(now){
  const dt=Math.min((now-lastT)/1000,0.05)*state.motion.speed; lastT=now; state.anim.t+=dt;
  if(dirty)rebuild();
  ctx.fillStyle=PAPER; ctx.fillRect(0,0,W,H);
  const cm=cam(); const R=revealFactors(state.anim.t, motionResolve(state.motion.x,state.motion.y).ease, state.anim.hold);
  cm.yaw+=R.yawOff; cm.tilt+=R.tiltOff;
  if(state.hex.base && R.baseK>0.01){ ctx.strokeStyle=INK; ctx.globalAlpha=0.05*R.baseK; const g=footprint(state.hex.size,6,0);
    for(const b of bins){ ctx.beginPath(); g.forEach((v,i)=>{const p=toScr(b.x+v[0],0,b.y+v[1],cm); i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y);}); ctx.closePath(); ctx.stroke(); } ctx.globalAlpha=1; }
  const faces=buildFaces(cm,R);
  for(const f of faces){ ctx.beginPath(); f.pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)); ctx.closePath();
    if(f.fill){ ctx.fillStyle=f.fill; ctx.fill(); } if(f.so>0){ ctx.strokeStyle=INK; ctx.globalAlpha=f.so; ctx.stroke(); ctx.globalAlpha=1; } }
  if(state.sel){ const c=hitCols.find(x=>x.b===state.sel); if(c){ const txt=state.sel.count+' pts';
    ctx.font='11px ui-monospace,monospace'; const w=ctx.measureText(txt).width+14; let bx=Math.min(W-w-8,c.sx+8),by=c.sy-24;
    ctx.beginPath(); ctx.roundRect(bx,by,w,20,7); ctx.fillStyle=INK; ctx.fill(); ctx.fillStyle=PAPER; ctx.fillText(txt,bx+7,by+14); } }
  ctx.font='11px ui-monospace,monospace'; ctx.fillStyle=INK; ctx.globalAlpha=0.65*R.labK; ctx.textAlign='right';
  ctx.fillText(String(state.data.title).toUpperCase()+' · '+state.data.count+' pts · '+bins.length+' bins · max '+maxC, W-16,26); ctx.textAlign='left'; ctx.globalAlpha=1;
  if(!document.body.classList.contains('noui')) drawGizmo(cm);
  requestAnimationFrame(frame);
}
/* XYZ-гизмо (канон) */
const GIZMO_R=46; function gizmoCenter(){ return {x:W-72,y:H-72}; }
function drawGizmo(cm){ const g=gizmoCenter(),r=GIZMO_R;
  ctx.beginPath(); ctx.arc(g.x,g.y,r,0,TAU); ctx.fillStyle=PAPER; ctx.globalAlpha=0.85; ctx.fill();
  ctx.strokeStyle=INK; ctx.globalAlpha=0.2; ctx.stroke(); ctx.globalAlpha=1; ctx.font='9px ui-monospace,monospace';
  const axes=[{v:{x:1,y:0,z:0},t:'X',c:ACC},{v:{x:0,y:1,z:0},t:'Y',c:INK},{v:{x:0,y:0,z:1},t:'Z',c:MUTED}]
    .map(a=>({...a,q:vT(a.v,cm)})).sort((a,b)=>b.q.z-a.q.z);
  for(const a of axes){ const L=r*0.7, ex=g.x+a.q.x*L, ey=g.y-a.q.y*L;
    ctx.globalAlpha=0.25; ctx.beginPath(); ctx.moveTo(g.x,g.y); ctx.lineTo(g.x-a.q.x*L,g.y+a.q.y*L); ctx.strokeStyle=a.c; ctx.setLineDash([2,3]); ctx.stroke(); ctx.setLineDash([]);
    ctx.globalAlpha=a.q.z<0?0.95:0.45; ctx.beginPath(); ctx.moveTo(g.x,g.y); ctx.lineTo(ex,ey); ctx.lineWidth=1.3; ctx.stroke(); ctx.lineWidth=1;
    ctx.beginPath(); ctx.arc(ex,ey,2.5,0,TAU); ctx.fillStyle=a.c; ctx.fill(); ctx.fillText(a.t,ex+4,ey-4); ctx.globalAlpha=1; } }
requestAnimationFrame(frame);

/* взаимодействие — наклон БЕЗ ограничений (полный диапазон, вид сверху) */
let dragging=false,gizmoDrag=false,px=0,py=0,moved=0;
cv.addEventListener('pointerdown',e=>{ const g=gizmoCenter(); gizmoDrag=Math.hypot(e.clientX-g.x,e.clientY-g.y)<GIZMO_R; dragging=true;px=e.clientX;py=e.clientY;moved=0; });
addEventListener('pointermove',e=>{ if(!dragging)return; const dx=e.clientX-px,dy=e.clientY-py;px=e.clientX;py=e.clientY;moved+=Math.abs(dx)+Math.abs(dy);
  const k=gizmoDrag?2:1; state.cam.yaw+=dx*0.3*k; state.cam.tilt-=dy*0.25*k; syncPanel(); });
addEventListener('pointerup',e=>{ if(dragging && moved<5 && !gizmoDrag){ let best=null,bd=1e9; for(const c of hitCols){ const d=Math.hypot(c.sx-e.clientX,c.sy-e.clientY); if(d<bd){bd=d;best=c.b;} } state.sel=(bd<40)?best:null; }
  dragging=false; gizmoDrag=false; });
cv.addEventListener('wheel',e=>{e.preventDefault();state.cam.dist=clamp(state.cam.dist*Math.exp(e.deltaY*0.0012),2,7);},{passive:false});

/* ===== панель ===== */
const $=s=>document.querySelector(s);
const getPath=k=>k.split('.').reduce((o,p)=>o[p],state);
const setPath=(k,v)=>{const ps=k.split('.'),last=ps.pop();ps.reduce((o,p)=>o[p],state)[last]=v; if(k.startsWith('data.')||k==='hex.size')dirty=true;};
const defs={ gHex:[['hex.height','Height',0,1.6,0.05],['hex.minH','Min height (рост)',0,0.6,0.02],['hex.size','Hex size',0.03,0.16,0.005],['hex.sizeVar','Size range',0,1,0.05],['hex.sides','Sides',3,10,1],['hex.round','Roundness',0,1,0.05],['hex.floors','Floors',2,10,1],['hex.taper','Taper',0,0.9,0.02],['hex.gLight','Gray light',0.4,1,0.02],['hex.gDark','Gray dark',0,0.5,0.02],['hex.side','Side shade',0.4,1,0.02],['hex.invert','Invert (dense=light)',0,1,1],['hex.edges','Edges',0,1,1],['hex.base','Base grid',0,1,1]],
  gCam:[['cam.tilt','Tilt (полный)',-180,360,1],['cam.yaw','Rotate',-180,360,1],['cam.dist','Zoom',2,7,0.1]],
  gMotionSliders:[['motion.speed','Speed',0.4,2,0.01]],
  gData:[['data.count','Points',200,20000,100],['data.clusters','Clusters',1,8,1],['data.seed','Seed',1,999,1]] };
function buildSliders(elId,arr){const el=$('#'+elId);[...el.querySelectorAll('.row')].forEach(r=>r.remove());
  for(const [key,name,min,max,stp] of arr){const row=document.createElement('div');row.className='row';
    if(min===0&&max===1&&stp===1){row.classList.add('toggle');row.innerHTML=`<label>${name}</label><input type="checkbox" class="sw">`;const cb=row.querySelector('input');cb.checked=!!getPath(key);cb.dataset.key=key;cb.addEventListener('change',()=>setPath(key,cb.checked?1:0));el.appendChild(row);continue;}
    row.innerHTML=`<label>${name}</label><input type="range" min="${min}" max="${max}" step="${stp}"><input type="number" min="${min}" max="${max}" step="${stp}">`;
    const inp=row.querySelector('input[type=range]'),val=row.querySelector('input[type=number]'),fmt=x=>+(+x).toFixed(stp<1?3:0);
    inp.value=getPath(key);val.value=fmt(getPath(key));inp.dataset.key=key;inp.addEventListener('input',()=>{setPath(key,+inp.value);val.value=fmt(inp.value);});val.addEventListener('change',()=>{const x=parseFloat(val.value);if(isFinite(x)){setPath(key,x);inp.value=Math.max(min,Math.min(max,x));}});el.appendChild(row);}
}
buildSliders('gHex',defs.gHex);buildSliders('gCam',defs.gCam);buildSliders('gMotionSliders',defs.gMotionSliders);buildSliders('gData',defs.gData);
function wireSel(id,key,after){ const s=$('#'+id); s.value=getPath(key); s.addEventListener('change',()=>{ setPath(key,s.value); if(after)after(); }); }
wireSel('selStyle','hex.style',()=>{ if(state.hex.style==='towers')state.hex.taper=0; if(state.hex.style==='peaks')state.hex.taper=Math.max(state.hex.taper,0.82); syncPanel(); });
wireSel('selPalette','hex.palette'); wireSel('selHmap','hex.hmap');
// пресеты
const presetSeg=$('#presetSeg');
Object.keys(PRESETS).forEach(name=>{ const b=document.createElement('button'); b.textContent=name; b.dataset.p=name;
  b.addEventListener('click',()=>{ const P=PRESETS[name]; Object.assign(state.hex,P.hex); Object.assign(state.cam,P.cam);
    [...presetSeg.children].forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false')); dirty=true; state.anim.t=0; syncPanel(); });
  presetSeg.appendChild(b); });
presetSeg.firstChild.setAttribute('aria-pressed','true');
// Look
$('#lookSeg').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b)return; const L=LOOKS[b.dataset.look]; if(!L)return;
  for(const [k,v] of Object.entries(L)) setPath(k,v); [...$('#lookSeg').children].forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false')); syncPanel(); });
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;document.querySelectorAll('#tabs button').forEach(x=>x.setAttribute('aria-selected',x===b));document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.tab===b.dataset.tab));});
document.querySelectorAll('#panel legend').forEach(lg=>lg.addEventListener('click',()=>lg.parentElement.classList.toggle('closed')));
$('#nTitle').value=state.data.title;$('#nTitle').addEventListener('input',e=>state.data.title=e.target.value);
$('#reseed').addEventListener('click',()=>{state.data.seed=Math.floor(Math.random()*999)+1;dirty=true;state.anim.t=0;syncPanel();});
function syncPanel(){document.querySelectorAll('#panel input[type=range]').forEach(inp=>{const k=inp.dataset.key;if(!k)return;const x=getPath(k),stp=+inp.step;inp.value=x;inp.nextElementSibling.value=+(+x).toFixed(stp<1?3:0);});document.querySelectorAll('#panel input.sw').forEach(cb=>{if(cb.dataset.key)cb.checked=!!getPath(cb.dataset.key);});
  ['selStyle:hex.style','selPalette:hex.palette','selHmap:hex.hmap'].forEach(p=>{const[i,k]=p.split(':');const s=$('#'+i);if(s)s.value=getPath(k);});}
/* config */
$('#saveCfg').addEventListener('click',()=>{const a=document.createElement('a');a.download='hexbin-config.json';a.href=URL.createObjectURL(new Blob([JSON.stringify({version:4,hex:state.hex,cam:state.cam,data:state.data,motion:state.motion},null,1)],{type:'application/json'}));a.click();});
$('#loadCfg').addEventListener('click',()=>$('#loadFile').click());
$('#loadFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{const c=JSON.parse(t);if(c.hex)state.hex={...state.hex,...c.hex};if(c.cam)state.cam={...state.cam,...c.cam};if(c.data)state.data={...state.data,...c.data};if(c.motion)state.motion={...state.motion,...c.motion};$('#nTitle').value=state.data.title;dirty=true;syncPanel();});});
/* SVG (полный reveal, та же глобальная сортировка) */
function svgOut(){ if(dirty)rebuild(); const cm=cam(); const faces=buildFaces(cm,null);
  const P=pts=>'M'+pts.map(p=>p.x.toFixed(1)+' '+p.y.toFixed(1)).join('L')+'Z';
  let s=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><rect width="${W}" height="${H}" fill="${PAPER}"/>`;
  for(const f of faces){ s+=`<path d="${P(f.pts)}" fill="${f.fill||'none'}"${f.so>0?` stroke="${INK}" stroke-opacity="${f.so}"`:''}/>`; }
  s+=`</svg>`; const a=document.createElement('a');a.download='hexbin.svg';a.href=URL.createObjectURL(new Blob([s],{type:'image/svg+xml'}));a.click();
}
$('#svgBtn').addEventListener('click',svgOut);
$('#pngBtn').addEventListener('click',()=>{const a=document.createElement('a');a.download='hexbin.png';a.href=cv.toDataURL('image/png');a.click();});
function toggleUI(){document.body.classList.toggle('noui');}$('#hideBtn').addEventListener('click',toggleUI);
addEventListener('keydown',e=>{if(e.key.toLowerCase()==='h'&&!['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))toggleUI();});
/* транспорт */
(function(){ const rp=$('#mReplay'),lp=$('#mLoop'),hd=$('#mHold');
  if(rp)rp.addEventListener('click',()=>{state.anim.t=0;}); if(hd)hd.addEventListener('input',()=>{state.anim.hold=+hd.value;});
  if(lp)lp.addEventListener('click',()=>{state.anim.loop=state.anim.loop?0:1;lp.setAttribute('aria-pressed',state.anim.loop?'true':'false');if(!state.anim.loop)state.anim.t=0;}); })();
/* Motion Pad */
(function initMotionPad(){
  const cINK=INK,cMUT=MUTED,cACC=ACC,cLINE=css('--line');
  const padEl=$('#mpad'),padC=$('#mpadc'),prevC=$('#mprevc'),easeSel=$('#mEase'),pc=padC.getContext('2d'),rc=prevC.getContext('2d');
  const PRESETS_XY={balanced:[.5,.5],slow:[.12,.12],fast:[.88,.12],soft:[.12,.88],raw:[.88,.88],gentle:[.3,.7],snappy:[.72,.28]}; const cl=v=>v<0?0:v>1?1:v;
  function nearest(){let b='balanced',bd=1e9;for(const k in PRESETS_XY){const dx=PRESETS_XY[k][0]-state.motion.x,dy=PRESETS_XY[k][1]-state.motion.y,d=dx*dx+dy*dy;if(d<bd){bd=d;b=k;}}return b;}
  function fit(c){const dpr=Math.min(devicePixelRatio||1,2),r=c.getBoundingClientRect();c.width=Math.max(1,r.width*dpr);c.height=Math.max(1,r.height*dpr);c.getContext('2d').setTransform(dpr,0,0,dpr,0,0);return{w:r.width,h:r.height};}
  let PD=fit(padC),RD=fit(prevC),phase=0,lastM=performance.now();
  addEventListener('resize',()=>{PD=fit(padC);RD=fit(prevC);}); setTimeout(()=>{PD=fit(padC);RD=fit(prevC);},90);
  const cur=()=>motionResolve(state.motion.x,state.motion.y);
  function drawPad(){const{w,h}=PD,c=cur();pc.clearRect(0,0,w,h);pc.strokeStyle=cLINE;pc.lineWidth=1;
    for(let i=1;i<4;i++){const g=i/4;pc.globalAlpha=.6;pc.beginPath();pc.moveTo(g*w,0);pc.lineTo(g*w,h);pc.stroke();pc.beginPath();pc.moveTo(0,g*h);pc.lineTo(w,g*h);pc.stroke();}
    pc.globalAlpha=1;const p0=13;pc.strokeStyle=cACC;pc.globalAlpha=.28;pc.lineWidth=2;pc.beginPath();
    for(let i=0;i<=60;i++){const t=i/60,xx=p0+t*(w-2*p0),yy=(h-p0)-c.ease(t)*(h-2*p0);i?pc.lineTo(xx,yy):pc.moveTo(xx,yy);}pc.stroke();
    pc.globalAlpha=.1;pc.setLineDash([3,4]);pc.beginPath();pc.moveTo(p0,h-p0);pc.lineTo(w-p0,p0);pc.stroke();pc.setLineDash([]);pc.globalAlpha=1;
    const px=state.motion.x*w,py=(1-state.motion.y)*h;pc.strokeStyle=cINK;pc.globalAlpha=.22;pc.beginPath();pc.moveTo(px,0);pc.lineTo(px,h);pc.moveTo(0,py);pc.lineTo(w,py);pc.stroke();pc.globalAlpha=1;
    pc.fillStyle=cINK;pc.beginPath();pc.arc(px,py,6,0,TAU);pc.fill();pc.fillStyle='#fff';pc.beginPath();pc.arc(px,py,2.2,0,TAU);pc.fill();}
  function drawPrev(dt){const{w,h}=RD,c=cur();rc.clearRect(0,0,w,h);const y0=h/2,x0=13,x1=w-13;
    rc.strokeStyle=cLINE;rc.lineWidth=1;rc.beginPath();rc.moveTo(x0,y0);rc.lineTo(x1,y0);rc.stroke();
    phase+=dt*state.motion.speed*0.6;if(phase>1.35)phase-=1.35;const p=cl(phase);
    rc.fillStyle=cMUT;rc.globalAlpha=.45;rc.beginPath();rc.arc(x0+p*(x1-x0),y0+8,3,0,TAU);rc.fill();rc.globalAlpha=1;
    rc.fillStyle=cINK;rc.beginPath();rc.arc(x0+c.ease(p)*(x1-x0),y0-8,4.6,0,TAU);rc.fill();}
  function commit(){state.motion.speed=+cur().speed.toFixed(2);syncPanel();easeSel.value=nearest();drawPad();}
  function fromEvt(e){const r=padEl.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width,y:1-(e.clientY-r.top)/r.height};}
  let drag=false;
  padEl.addEventListener('pointerdown',e=>{drag=true;padEl.setPointerCapture(e.pointerId);const p=fromEvt(e);state.motion.x=cl(p.x);state.motion.y=cl(p.y);commit();});
  padEl.addEventListener('pointermove',e=>{if(drag){const p=fromEvt(e);state.motion.x=cl(p.x);state.motion.y=cl(p.y);commit();}});
  padEl.addEventListener('pointerup',()=>drag=false);padEl.addEventListener('pointercancel',()=>drag=false);
  const spInp=$('#gMotionSliders input[type=range]');
  if(spInp)spInp.addEventListener('input',()=>{state.motion.x=speedToX(+spInp.value,state.motion.y);easeSel.value=nearest();drawPad();});
  easeSel.addEventListener('change',()=>{const q=PRESETS_XY[easeSel.value]||[.5,.5];state.motion.x=q[0];state.motion.y=q[1];commit();});
  (function ml(now){const dt=Math.min((now-lastM)/1000,0.05);lastM=now;drawPad();drawPrev(dt);requestAnimationFrame(ml);})(performance.now());
  commit();
})();
resize();
</script>
